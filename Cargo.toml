[workspace]
resolver = "3"
members = ["uebersetzer", "laufzeit", "leistung/messen"]
# Das Messwerkzeug redet direkt mit Windows und wird nur dort gebaut (cargo build -p oida-messen).
default-members = ["uebersetzer", "laufzeit"]

[workspace.package]
version = "0.14.0"
edition = "2024"

# Mit diesem Profil wird die Laufzeitbibliothek gebaut, die in jedes
# OIDA-Programm gelinkt wird (siehe uebersetzer/build.rs).
[profile.laufzeit]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
debug = false
