[workspace]
resolver = "3"
members = ["uebersetzer", "laufzeit", "leistung/messen", "installer/windows"]
# Das Messwerkzeug und der Windows-Installer reden direkt mit Windows und werden nur auf
# Wunsch gebaut (cargo build -p oida-messen, installer/bauen.ps1).
default-members = ["uebersetzer", "laufzeit"]

[workspace.package]
version = "0.22.0"
edition = "2024"

# Mit diesem Profil wird die Laufzeitbibliothek gebaut, die in jedes
# OIDA-Programm gelinkt wird (siehe uebersetzer/build.rs).
[profile.laufzeit]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
debug = false
